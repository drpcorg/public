# buf v2 generation template for the Yellowstone (Dragon's Mouth) Solana Geyser
# gRPC protos, pinned to a yellowstone-grpc proto release tag. Same shape as
# chain-apis/tron.gen.yaml: no submodule, the tag in the git_repo input pins the
# source. Unlike the other chain APIs this one also generates gRPC stubs: dproxy
# serves geyser.Geyser and dials the upstream with it.
#
# Why generate at all: the Go bindings upstream ships
# (github.com/rpcpool/yellowstone-grpc/examples/golang) are regenerated by hand
# and lag the proto - at proto-v14.0.1 they still have no Alpenglow block footer
# (SubscribeRequest.block_footer, SubscribeUpdate.block_footer and the
# certificates), so consumers would only see those as unknown fields.
#
# geyser.proto imports solana-storage.proto with `import public` and both sit in
# one directory, so both land in one package, pkg/yellowstone, the way upstream's
# own go_package puts them.
version: v2
managed:
  enabled: true
  override:
    - file_option: go_package
      value: github.com/drpcorg/public/pkg/yellowstone
plugins:
  - local: ["go", "tool", "protoc-gen-go"]
    out: pkg
    opt:
      - module=github.com/drpcorg/public/pkg
  - local: ["go", "tool", "protoc-gen-go-grpc"]
    out: pkg
    opt:
      - module=github.com/drpcorg/public/pkg
inputs:
  - git_repo: https://github.com/rpcpool/yellowstone-grpc.git
    tag: proto-v14.0.1
    subdir: yellowstone-grpc-proto/proto
    paths:
      - geyser.proto
      - solana-storage.proto
