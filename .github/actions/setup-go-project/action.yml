name: "Setup Go Project"
description: "Go setup with module cache and dependency verification"
inputs:
  go-version:
    description: "Go version to use"
    required: false
    default: "1.27.0"
  cache-key-suffix:
    description: "Additional suffix for cache key"
    required: false
    default: ""
outputs:
  go-version:
    description: "Actual Go version used"
    value: ${{ steps.setup-go.outputs.go-version }}

runs:
  using: "composite"
  steps:
    - name: Set up Go
      id: setup-go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ inputs.go-version }}
        cache: true
        cache-dependency-path: |
          go.sum
          go.mod

    - name: Download dependencies
      shell: bash
      run: go mod download

    - name: Verify dependencies
      shell: bash
      run: go mod verify
